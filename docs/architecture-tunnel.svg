<rect x="40" y="120" width="170" height="62" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125.0" y="147.0" text-anchor="middle" class="hs">BOINC clients</text>
<text x="125.0" y="163.0" text-anchor="middle" class="s">volunteers</text>
<rect x="40" y="230" width="170" height="62" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125.0" y="257.0" text-anchor="middle" class="hs">Browsers</text>
<text x="125.0" y="273.0" text-anchor="middle" class="s">website, forum</text>
<rect x="40" y="780" width="170" height="62" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125.0" y="807.0" text-anchor="middle" class="hs">Admins</text>
<text x="125.0" y="823.0" text-anchor="middle" class="s">tech admin, project admins</text>
<rect x="40" y="370" width="170" height="250" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125" y="392" text-anchor="middle" class="hs">DNS</text>
<text x="125" y="425" text-anchor="middle" class="hs">rkfold.rechenkraft.net</text>
<text x="125" y="442" text-anchor="middle" class="s">A/AAAA → VPS</text>
<text x="125" y="476" text-anchor="middle" class="hs">kifold.kerbodyne.com</text>
<text x="125" y="493" text-anchor="middle" class="s">A/AAAA → VPS</text>
<text x="125" y="527" text-anchor="middle" class="s">or CNAME to the</text>
<text x="125" y="544" text-anchor="middle" class="s">VPS host name</text>
<rect x="270" y="60" width="370" height="560" rx="12" fill="#fffdf5" stroke="#a3a3a3" stroke-width="1.5"/>
<text x="455" y="84" text-anchor="middle" class="hs">VPS  (fixed public IP)</text>
<rect x="295" y="110" width="320" height="190" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="455.0" y="161.0" text-anchor="middle" class="hs">Caddy  (public edge, root)</text>
<text x="455.0" y="177.0" text-anchor="middle" class="s">only public ports :80 / :443</text>
<text x="455.0" y="193.0" text-anchor="middle" class="s">TLS: Let's Encrypt for both domains</text>
<text x="455.0" y="209.0" text-anchor="middle" class="s">rkfold.rechenkraft.net, kifold.kerbodyne.com</text>
<text x="455.0" y="225.0" text-anchor="middle" class="s">→ reverse_proxy 100.64.0.2:80</text>
<text x="455.0" y="241.0" text-anchor="middle" class="s">(Host header passed through)</text>
<text x="455.0" y="257.0" text-anchor="middle" class="s">later: rate limits, download cache</text>
<rect x="295" y="330" width="320" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="455.0" y="366.0" text-anchor="middle" class="hs">Tailscale node</text>
<text x="455.0" y="382.0" text-anchor="middle" class="s">100.64.0.1</text>
<rect x="295" y="440" width="320" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="471.0" text-anchor="middle" class="hs">no project data</text>
<text x="455.0" y="487.0" text-anchor="middle" class="s">replaceable: new VPS + DNS change</text>
<rect x="295" y="530" width="320" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="561.0" text-anchor="middle" class="hs">optional: Headscale</text>
<text x="455.0" y="577.0" text-anchor="middle" class="s">(self-hosted Tailscale control server)</text>
<rect x="648" y="300" width="144" height="160" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720" y="330" text-anchor="middle" class="hs">Tailscale</text>
<text x="720" y="346" text-anchor="middle" class="s">(WireGuard)</text>
<text x="720" y="375" text-anchor="middle" class="s">started from the</text>
<text x="720" y="389" text-anchor="middle" class="s">BOINC host:</text>
<text x="720" y="403" text-anchor="middle" class="s">no open ports,</text>
<text x="720" y="417" text-anchor="middle" class="s">no port forwarding,</text>
<text x="720" y="431" text-anchor="middle" class="s">changing IP is fine</text>
<rect x="800" y="60" width="860" height="880" rx="12" fill="#fffdf5" stroke="#a3a3a3" stroke-width="1.5"/>
<text x="1230" y="84" text-anchor="middle" class="hs">BOINC host  (home server, Ubuntu, Podman)</text>
<rect x="830" y="110" width="330" height="150" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="995.0" y="149.0" text-anchor="middle" class="hs">Caddy  (internal, root)</text>
<text x="995.0" y="165.0" text-anchor="middle" class="s">listens only on 100.64.0.2:80 (Tailscale)</text>
<text x="995.0" y="181.0" text-anchor="middle" class="s">no own TLS (done on the VPS)</text>
<text x="995.0" y="197.0" text-anchor="middle" class="s">routes by host name and path</text>
<text x="995.0" y="213.0" text-anchor="middle" class="s">trusted_proxies 100.64.0.0/10</text>
<text x="995.0" y="229.0" text-anchor="middle" class="s">generated by scripts/caddy-sync.sh</text>
<rect x="830" y="290" width="330" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
