<rect width="1680" height="1000" fill="#fff"/>
<text x="20" y="30" style="font-size:18px;font-weight:700;fill:#0f172a">boinc-stack: public edge on a VPS, BOINC host behind Tailscale</text>
<rect x="20" y="60" width="210" height="880" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
