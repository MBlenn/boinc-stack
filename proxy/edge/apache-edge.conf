# Edge proxy with Apache on a VPS (see docs/edge.md).
# Terminates TLS for the public hostname and forwards everything via Tailscale to the
# Caddy of the BOINC host. Replace boinc.example.org and boinc-host (Tailscale name or IP).
#
#   a2enmod proxy proxy_http headers ssl
#   cp apache-edge.conf /etc/apache2/sites-available/boinc.example.org.conf
#   a2ensite boinc.example.org && systemctl reload apache2
#   certbot --apache -d boinc.example.org      # adds the certificate to the *:443 vhost

<VirtualHost *:80>
    ServerName boinc.example.org
    # everything except ACME challenges goes to HTTPS
    RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://boinc.example.org/$1"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName boinc.example.org

    # SSLEngine on
    # SSLCertificateFile    /etc/letsencrypt/live/boinc.example.org/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/boinc.example.org/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf

    # The BOINC host routes by Host header (Caddy site http://boinc.example.org)
    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://boinc-host/ connectiontimeout=10 timeout=300
    ProxyPassReverse / http://boinc-host/
    # mod_proxy adds X-Forwarded-For; tell the backend the original scheme
    RequestHeader set X-Forwarded-Proto "https"

    # BOINC uploads go through the edge: keep the default limit (1 GiB) or raise it
    # LimitRequestBody 1073741824

    ErrorLog  ${APACHE_LOG_DIR}/boinc-edge-error.log
    CustomLog ${APACHE_LOG_DIR}/boinc-edge-access.log combined
</VirtualHost>
</IfModule>
